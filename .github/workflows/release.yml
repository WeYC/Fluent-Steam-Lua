name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 0.0.0；支持 0.0.0.0 或 0.0.0-fix，空格会自动转连字符）"
        required: true
      prerelease:
        description: "预发布版本"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate version and tag
        shell: pwsh
        env:
          VERSION_RAW: ${{ inputs.version }}
        run: |
          $raw = $env:VERSION_RAW.Trim()
          if ([string]::IsNullOrWhiteSpace($raw)) { throw "版本号不能为空" }
          # 空格/下划线统一转连字符：0.0.0 fix → 0.0.0-fix（tag/文件名/csproj 都合法）
          $version = $raw -replace '[\s_]+', '-'
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$') {
            throw "版本号格式非法，应为 x.y.z，可选 .w 或 -后缀（如 0.0.0.0、0.0.0-fix）；当前输入：$raw"
          }
          git fetch --tags --quiet

          # tag 已存在不一定是重复发布：上次可能在建 tag 之后失败（如创建 Release 报错），
          # 此时应允许续作，否则该版本永远发不出去。
          if (git tag --list $version) {
            $api = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$version"
            # 用内置 token 调 API：匿名访问容易 403 限流，被误判成"已发布"
            $headers = @{ 'User-Agent' = 'SteamLua-CI'; 'Authorization' = "Bearer $($env:GITHUB_TOKEN)" }
            $hasRelease = $false
            try {
              Invoke-RestMethod -Uri $api -Headers $headers -TimeoutSec 30 | Out-Null
              $hasRelease = $true
            } catch {
              $code = $_.Exception.Response.StatusCode.value__
              if ($code -ne 404) {
                Write-Host "无法确认已有 Release（HTTP $code），按未发布处理并继续"
              }
            }
            if ($hasRelease) { throw "版本 $version 已发布（tag 与 Release 均已存在），停止" }
            Write-Host "tag $version 已存在但尚无 Release，视为上次中断，继续完成发布"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Bump csproj version and push
        shell: pwsh
        run: |
          $csproj = 'SteamLua.csproj'
          $text = [System.IO.File]::ReadAllText((Resolve-Path $csproj).Path)
          $updated = [System.Text.RegularExpressions.Regex]::Replace(
            $text, '<Version>[^<]*</Version>', '<Version>${{ env.VERSION }}</Version>')
          if ($updated -eq $text -and $text -notmatch '<Version>${{ env.VERSION }}</Version>') {
            throw 'csproj 中未找到 <Version> 节点'
          }
          [System.IO.File]::WriteAllText(
            (Resolve-Path $csproj).Path, $updated, (New-Object System.Text.UTF8Encoding($false)))
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add SteamLua.csproj
          # 版本号已是目标值时没有可提交内容，git commit 会非零退出，需区分
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host '版本号未变化，跳过提交'
          } else {
            git commit -m "update: 版本号更新${{ env.VERSION }}"
            git push origin HEAD:main
          }

      - name: Create tag
        shell: pwsh
        run: |
          # tag 可能已在上一次中断的发布中创建，存在就跳过
          if (git rev-parse -q --verify "refs/tags/${{ env.VERSION }}") {
            Write-Host "tag ${{ env.VERSION }} 已存在，跳过创建"
          } else {
            git tag '${{ env.VERSION }}'
            git push origin '${{ env.VERSION }}'
          }

      # 自包含发布：运行时随包内置，只出 x64
      - name: Publish full version
        shell: pwsh
        run: dotnet publish SteamLua.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:Version=${{ env.VERSION }} -o publish/portable

      - name: Publish portable version
        shell: pwsh
        run: dotnet publish SteamLua.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:AppExeName="SteamLua" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }} -o publish/single

      # windows-latest 未预装 Inno Setup，且官方安装包不含简体中文语言文件
      # （installer/SteamLua.iss 的 [Languages] 引用了它，缺文件会编译失败）
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = '6.7.4'

          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $tag = 'is-' + ($Version -replace '\.', '_')
            $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$Version.exe"
            $installer = Join-Path $env:RUNNER_TEMP "innosetup-$Version.exe"
            Write-Host "下载 Inno Setup $Version : $url"

            $ok = $false
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing -TimeoutSec 600
                if ((Test-Path $installer) -and (Get-Item $installer).Length -gt 3MB) { $ok = $true; break }
              } catch {
                Write-Host "  第 $i 次下载失败: $($_.Exception.Message)"
                Start-Sleep -Seconds 5
              }
            }
            if (-not $ok) { throw "Inno Setup 下载失败：$url" }

            $proc = Start-Process -FilePath $installer `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -PassThru -Wait
            if ($proc.ExitCode -ne 0) { throw "Inno Setup 安装失败，退出码 $($proc.ExitCode)" }

            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) {
              $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $iscc) { throw '已安装 Inno Setup，但找不到 ISCC.exe' }
          }

          $chinese = Join-Path (Split-Path $iscc -Parent) 'Languages\ChineseSimplified.isl'
          if (-not (Test-Path $chinese)) {
            Write-Host '下载简体中文语言文件'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl' `
              -OutFile $chinese -UseBasicParsing -TimeoutSec 120
            if ((Get-Item $chinese).Length -lt 5000) { throw 'ChineseSimplified.isl 内容异常（疑似下载到错误页）' }
          }

          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # 打包三件产物：portable zip、full zip、setup 安装程序。
      # 两个 zip 内部套一层版本目录，解压得到干净文件夹。
      - name: Build packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = '${{ env.VERSION }}'
          if ([string]::IsNullOrWhiteSpace($Version)) { throw "VERSION 为空" }

          $OutputDir = 'publish/dist'
          New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null
          $OutputDir = (Resolve-Path $OutputDir).Path

          $iscc = $env:ISCC
          if ([string]::IsNullOrWhiteSpace($iscc) -or -not (Test-Path $iscc)) { throw "未找到 ISCC.exe" }

          $singleSrc = "publish/single"
          $portableSrc = "publish/portable"
          foreach ($dir in @($singleSrc, $portableSrc)) {
            if (-not (Test-Path $dir)) { throw "缺少发布目录：$dir" }
          }

          # 结构守卫：运行期数据写到 %LocalAppData%，绝不能混进发布包
          foreach ($src in @($singleSrc, $portableSrc)) {
            foreach ($leak in 'settings.json', 'app.log', 'cache', 'bindings.json') {
              if (Test-Path "$src/$leak") { throw "运行期数据不应出现在发布包：$src/$leak" }
            }
          }
          if (-not (Test-Path "$singleSrc/SteamLua.exe")) { throw "缺少 $singleSrc/SteamLua.exe" }
          if (-not (Test-Path "$portableSrc/SteamLua.exe")) { throw "缺少 $portableSrc/SteamLua.exe" }
          $exeCount = (Get-ChildItem $singleSrc -Filter *.exe -File).Count
          if ($exeCount -ne 1) { throw "单文件版应只有一个 exe，实际 $exeCount 个" }

          $stage = Join-Path $env:RUNNER_TEMP "pkg-$Version"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          $singleRoot = Join-Path $stage "SteamLua-$Version-portable"
          $portableRoot = Join-Path $stage "SteamLua-$Version"
          New-Item -ItemType Directory -Path $singleRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
          Copy-Item "$singleSrc/*" -Destination $singleRoot -Recurse
          Copy-Item "$portableSrc/*" -Destination $portableRoot -Recurse
          Compress-Archive -Path $singleRoot -DestinationPath (Join-Path $OutputDir "SteamLua-$Version-portable.zip")
          Compress-Archive -Path $portableRoot -DestinationPath (Join-Path $OutputDir "SteamLua-$Version.zip")

          $setupOut = Join-Path $stage "setup"
          New-Item -ItemType Directory -Path $setupOut -Force | Out-Null
          & $iscc "/DMyAppVersion=$Version" "/DMySourceDir=$((Resolve-Path $portableSrc).Path)" "/DMyOutputDir=$setupOut" 'installer/SteamLua.iss'
          if ($LASTEXITCODE -ne 0) { throw "安装程序编译失败，退出码 $LASTEXITCODE" }
          $built = Get-ChildItem $setupOut -Filter *.exe -File | Select-Object -First 1
          if (-not $built) { throw "安装程序未产出 exe" }
          Copy-Item $built.FullName (Join-Path $OutputDir $built.Name)

          Get-ChildItem $OutputDir | Sort-Object Name | Select-Object Name, @{N = 'MB'; E = { [math]::Round($_.Length / 1MB, 2) } }

      - name: Compose release notes
        shell: pwsh
        run: |
          $header = '# SteamLua ${{ env.VERSION }}'
          $v = $env:VERSION
          $map = [ordered]@{
            '{SETUP}'    = "SteamLua-$v-setup.exe"
            '{PORTABLE}' = "SteamLua-$v-portable.zip"
            '{FULL}'     = "SteamLua-$v.zip"
          }
          $footer = Get-Content .github/RELEASE_FOOTER.md -Raw -Encoding utf8NoBOM
          foreach ($k in $map.Keys) { $footer = $footer.Replace($k, $map[$k]) }
          Set-Content release-notes.md -Value ($header + "`n`n" + $footer) -Encoding utf8NoBOM
          Get-Content release-notes.md -Encoding utf8NoBOM

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          # 只有三个产物，直接传整个目录
          # 注意：注释不能写在 files: | 的块内容里，否则会被当成文件模式去匹配。
          files: |
            publish/dist/*
