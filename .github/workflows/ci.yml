name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # 为空则构建产物内反馈通道为未配置态（fork PR 无权读取 secret，属预期行为）
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # 读出版本号，供后续产物命名使用
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $text = [System.IO.File]::ReadAllText((Resolve-Path 'SteamLua.csproj').Path)
          $m = [regex]::Match($text, '<Version>([^<]+)</Version>')
          if (-not $m.Success) { throw 'csproj 中未找到 <Version> 节点' }
          "value=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          Write-Host "版本: $($m.Groups[1].Value)"

      # 自包含发布：运行时随包内置，用户无需安装 .NET。
      # 只出 x64：子进程（Bridge/SvcMonitor/Updater）按 RuntimeIdentifier
      # 一并构建成同架构。
      - name: Publish full version
        shell: pwsh
        run: dotnet publish SteamLua.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -o publish/portable

      - name: Publish portable version
        shell: pwsh
        run: dotnet publish SteamLua.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:AppExeName="SteamLua" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/single

      # windows-latest 未预装 Inno Setup，且官方安装包不含简体中文语言文件
      # （installer/SteamLua.iss 的 [Languages] 引用了它，缺文件会编译失败）
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = '6.7.4'

          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $tag = 'is-' + ($Version -replace '\.', '_')
            $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$Version.exe"
            $installer = Join-Path $env:RUNNER_TEMP "innosetup-$Version.exe"
            Write-Host "下载 Inno Setup $Version : $url"

            # 个别网络下 TLS 握手会失败，重试几次
            $ok = $false
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing -TimeoutSec 600
                if ((Test-Path $installer) -and (Get-Item $installer).Length -gt 3MB) { $ok = $true; break }
              } catch {
                Write-Host "  第 $i 次下载失败: $($_.Exception.Message)"
                Start-Sleep -Seconds 5
              }
            }
            if (-not $ok) { throw "Inno Setup 下载失败：$url" }

            $proc = Start-Process -FilePath $installer `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -PassThru -Wait
            if ($proc.ExitCode -ne 0) { throw "Inno Setup 安装失败，退出码 $($proc.ExitCode)" }

            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) {
              $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $iscc) { throw '已安装 Inno Setup，但找不到 ISCC.exe' }
          }

          $chinese = Join-Path (Split-Path $iscc -Parent) 'Languages\ChineseSimplified.isl'
          if (-not (Test-Path $chinese)) {
            Write-Host '下载简体中文语言文件'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl' `
              -OutFile $chinese -UseBasicParsing -TimeoutSec 120
            # 空文件或 HTML 错误页会让后续编译以奇怪方式失败，提前拦住
            if ((Get-Item $chinese).Length -lt 5000) { throw 'ChineseSimplified.isl 内容异常（疑似下载到错误页）' }
          }

          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # 打包三件产物：portable zip、full zip、setup 安装程序。
      # 两个 zip 内部套一层版本目录，解压得到干净文件夹而非散落一堆文件。
      - name: Build packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = '${{ steps.version.outputs.value }}'
          if ([string]::IsNullOrWhiteSpace($Version)) { throw "版本号为空" }
          if ($Version -notmatch '^\d+\.\d+\.\d+') { throw "版本号格式非法：$Version" }

          $OutputDir = 'publish/dist'
          New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null
          $OutputDir = (Resolve-Path $OutputDir).Path

          $iscc = $env:ISCC
          if ([string]::IsNullOrWhiteSpace($iscc) -or -not (Test-Path $iscc)) { throw "未找到 ISCC.exe" }

          $singleSrc = "publish/single"
          $portableSrc = "publish/portable"
          foreach ($dir in @($singleSrc, $portableSrc)) {
            if (-not (Test-Path $dir)) { throw "缺少发布目录：$dir" }
          }

          # 结构守卫：运行期数据写到 %LocalAppData%，绝不能混进发布包
          foreach ($src in @($singleSrc, $portableSrc)) {
            foreach ($leak in 'settings.json', 'app.log', 'cache', 'bindings.json') {
              if (Test-Path "$src/$leak") { throw "运行期数据不应出现在发布包：$src/$leak" }
            }
          }
          if (-not (Test-Path "$singleSrc/SteamLua.exe")) { throw "缺少 $singleSrc/SteamLua.exe" }
          if (-not (Test-Path "$portableSrc/SteamLua.exe")) { throw "缺少 $portableSrc/SteamLua.exe" }
          $exeCount = (Get-ChildItem $singleSrc -Filter *.exe -File).Count
          if ($exeCount -ne 1) { throw "单文件版应只有一个 exe，实际 $exeCount 个" }

          $stage = Join-Path $env:RUNNER_TEMP "pkg-$Version"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          $singleRoot = Join-Path $stage "SteamLua-$Version-portable"
          $portableRoot = Join-Path $stage "SteamLua-$Version"
          New-Item -ItemType Directory -Path $singleRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
          Copy-Item "$singleSrc/*" -Destination $singleRoot -Recurse
          Copy-Item "$portableSrc/*" -Destination $portableRoot -Recurse
          Compress-Archive -Path $singleRoot -DestinationPath (Join-Path $OutputDir "SteamLua-$Version-portable.zip")
          Compress-Archive -Path $portableRoot -DestinationPath (Join-Path $OutputDir "SteamLua-$Version.zip")

          $setupOut = Join-Path $stage "setup"
          New-Item -ItemType Directory -Path $setupOut -Force | Out-Null
          & $iscc "/DMyAppVersion=$Version" "/DMySourceDir=$((Resolve-Path $portableSrc).Path)" "/DMyOutputDir=$setupOut" 'installer/SteamLua.iss'
          if ($LASTEXITCODE -ne 0) { throw "安装程序编译失败，退出码 $LASTEXITCODE" }
          $built = Get-ChildItem $setupOut -Filter *.exe -File | Select-Object -First 1
          if (-not $built) { throw "安装程序未产出 exe" }
          Copy-Item $built.FullName (Join-Path $OutputDir $built.Name)

          Get-ChildItem $OutputDir | Sort-Object Name | Select-Object Name, @{N = 'MB'; E = { [math]::Round($_.Length / 1MB, 2) } }

      # 上传三个产物
      - name: Upload portable
        uses: actions/upload-artifact@v5
        with:
          name: SteamLua-${{ steps.version.outputs.value }}-portable
          path: publish/dist/SteamLua-${{ steps.version.outputs.value }}-portable.zip
          retention-days: 7

      - name: Upload full
        uses: actions/upload-artifact@v5
        with:
          name: SteamLua-${{ steps.version.outputs.value }}
          path: publish/dist/SteamLua-${{ steps.version.outputs.value }}.zip
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: SteamLua-${{ steps.version.outputs.value }}-setup
          path: publish/dist/SteamLua-${{ steps.version.outputs.value }}-setup.exe
          retention-days: 7